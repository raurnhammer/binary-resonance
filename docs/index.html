<!DOCTYPE html>
<!--
    BINARY RESONANCE — Manfred Mohr Inspired Generative Art
    n-dimensional Hypercube Projections with evolving rotation
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Resonance — Algorithmic Geometry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            height: 100vh;
            overflow: hidden;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            height: 100vh;
            padding: 16px;
            gap: 16px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 4px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 12px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 16px; }
        .control-section:last-child { margin-bottom: 0; }

        .control-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 7px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button { margin-bottom: 0; }

        .control-group {
            display: grid;
            grid-template-columns: 112px 1fr;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--anthropic-dark);
            line-height: 1.2;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 32px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        #canvas-container {
            /* square that fits both the available width and the viewport height */
            width: min(100%, calc(100vh - 32px));
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            height: 100%;
        }

        @media (max-width: 600px) {
            body { height: auto; overflow: auto; }
            .container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; }
            #canvas-container { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Binary Resonance</h1>
            <div class="subtitle">Mohr P-Series grid algorithm — diagonal selection via noise fields (P021-G inspired)</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Grid Rows</label>
                    <div class="slider-container">
                        <input type="range" id="gridRows" min="10" max="80" step="2" value="40" oninput="updateParam('gridRows', this.value); regenerate()">
                        <span class="value-display" id="gridRows-value">40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grid Cols</label>
                    <div class="slider-container">
                        <input type="range" id="gridCols" min="10" max="80" step="2" value="40" oninput="updateParam('gridCols', this.value); regenerate()">
                        <span class="value-display" id="gridCols-value">40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.1" max="2.0" step="0.1" value="0.5" oninput="updateParam('noiseScale', this.value); regenerate()">
                        <span class="value-display" id="noiseScale-value">0.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale 2 (Overlay)</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale2" min="0.1" max="3.0" step="0.1" value="1.2" oninput="updateParam('noiseScale2', this.value); regenerate()">
                        <span class="value-display" id="noiseScale2-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Stroke Weight</label>
                    <div class="slider-container">
                        <input type="range" id="strokeWeight" min="0.3" max="2.0" step="0.1" value="0.6" oninput="updateParam('strokeWeight', this.value)">
                        <span class="value-display" id="strokeWeight-value">0.6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Show Grid Lines</label>
                    <div class="slider-container">
                        <input type="checkbox" id="showGrid" onchange="updateParam('showGrid', this.checked); redraw()">
                        <span class="value-display" id="showGrid-value">false</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Falloff Exponent</label>
                    <div class="slider-container">
                        <input type="range" id="falloffExponent" min="0.1" max="5.0" step="0.1" value="1.5" oninput="updateParam('falloffExponent', this.value); regenerate()">
                        <span class="value-display" id="falloffExponent-value">1.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Hard Cutoff (% from center)</label>
                    <div class="slider-container">
                        <input type="range" id="hardCutoffPct" min="0.0" max="1.0" step="0.05" value="1.0" oninput="updateParam('hardCutoffPct', this.value); regenerate()">
                        <span class="value-display" id="hardCutoffPct-value">1.0</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button" onclick="downloadPNG()" style="background: var(--anthropic-blue);">Download PNG</button>
                    <button class="button" onclick="downloadSVG()" style="background: var(--anthropic-green);">Download SVG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Generating Mohr grid...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // BINARY RESONANCE — MOHR P-SERIES GRID
        // Raster-based diagonal selection algorithm
        // ═══════════════════════════════════════════

        let params = {
            seed: 42,
            gridRows: 40,
            gridCols: 40,
            noiseScale: 0.5,
            noiseScale2: 1.2,
            strokeWeight: 0.6,
            showGrid: false,
            falloffExponent: 1.5,
            hardCutoffPct: 1.0
        };

        let defaultParams = {...params};
        let gridCells = [];       // Each cell stores row, col, diagonal type

        // ─── MATRIX MATH (n-dimensional) ──────────

        // ─── MOHR P-SERIES GRID ALGORITHM ──────────
        // Based on Manfred Mohr's P021-G (1970) style:
        // Raster-based diagonal selection — plotter drawing on paper

        function regenerate() {
            generateMohrGrid(params.gridRows, params.gridCols);
            redraw();
        }

        function generateMohrGrid(rows, cols) {
            gridCells = [];
            randomSeed(params.seed);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // Mohr's algorithmic rule: binary decision per cell
                    // Based on position + noise → determines diagonal direction
                    let n = noise(c * params.noiseScale, r * params.noiseScale, params.seed * 0.1);
                    let diagonal = (n > 0.5) ? 'forward' : 'backward';

                    // Additional complexity: overlay a second rule layer
                    let n2 = noise(c * params.noiseScale2, r * params.noiseScale2, params.seed * 0.3 + 100);
                    if (n2 > 0.7) {
                        diagonal = (diagonal === 'forward') ? 'backward' : 'forward';
                    }

                    gridCells.push({ row: r, col: c, diagonal });
                }
            }
        }

        // ─── DRAW MOHR GRID ──────────────────────

        function drawMohrGrid() {
            let rows = params.gridRows;
            let cols = params.gridCols;
            let cellW = width / cols;
            let cellH = height / rows;

            stroke(0);
            strokeWeight(params.strokeWeight);
            noFill();

            let cx = cols / 2.0;
            let cy = rows / 2.0;
            let maxDist = sqrt(cx * cx + cy * cy);
            let cutoffDist = maxDist * params.hardCutoffPct;

            // Compute accent position to clear it of grid lines
            let accentSize = 2;
            let marginCells = floor(min(rows, cols) * 0.15);
            randomSeed(params.seed + 42);
            let accentCol = floor(random(marginCells, cols - accentSize - marginCells));
            let accentRow = floor(random(marginCells, rows - accentSize - marginCells));

            for (let i = 0; i < gridCells.length; i++) {
                let cell = gridCells[i];

                // Skip cells covered by red accent square
                if (cell.col >= accentCol && cell.col < accentCol + accentSize &&
                    cell.row >= accentRow && cell.row < accentRow + accentSize) continue;

                // Density falloff: distance from center → probability of drawing
                let dx = cell.col - cx;
                let dy = cell.row - cy;
                let dist = sqrt(dx * dx + dy * dy);

                // Hard cutoff: skip cells beyond radius
                if (dist > cutoffDist) continue;

                let density = max(0, 1.0 - pow(dist / cutoffDist, params.falloffExponent));

                // Skip cells based on density (creates fading edge effect)
                if (random() > density) continue;

                let x = cell.col * cellW;
                let y = cell.row * cellH;

                if (cell.diagonal === 'forward') {
                    line(x, y, x + cellW, y + cellH); // \
                } else {
                    line(x + cellW, y, x, y + cellH); // /
                }
            }

            // Optional: add secondary grid lines for Mohr-style complexity
            if (params.showGrid) {
                stroke(0, 40); // Subtle grid lines
                strokeWeight(params.strokeWeight * 0.3);
                for (let r = 0; r <= rows; r++) {
                    line(0, r * cellH, width, r * cellH);
                }
                for (let c = 0; c <= cols; c++) {
                    line(c * cellW, 0, c * cellW, height);
                }
            }

            // Red diagonal accent square — Mohr plotter style
            drawRedAccent(rows, cols, cellW, cellH, accentCol, accentRow);
        }

        function drawRedAccent(rows, cols, cellW, cellH, accentCol, accentRow) {
            // 2×2 cells = 4 half-cells — red filled square with cut corners
            let accentSize = 2;
            let cornerCut = min(cellW, cellH) * 1.0;

            let x0 = accentCol * cellW;
            let y0 = accentRow * cellH;
            let w = accentSize * cellW;
            let h = accentSize * cellH;

            fill(255, 0, 0);
            noStroke();

            // Octagonal shape — cut all 4 corners
            beginShape();
            vertex(x0 + cornerCut, y0);       // top-left cut
            vertex(x0 + w - cornerCut, y0);   // top-right cut
            vertex(x0 + w, y0 + cornerCut);   // top-right cut
            vertex(x0 + w, y0 + h - cornerCut); // bottom-right cut
            vertex(x0 + w - cornerCut, y0 + h); // bottom-right cut
            vertex(x0 + cornerCut, y0 + h);   // bottom-left cut
            vertex(x0, y0 + h - cornerCut);   // bottom-left cut
            vertex(x0, y0 + cornerCut);       // top-left cut
            endShape(CLOSE);
        }

        // ─── P5.JS SETUP & DRAW ──────────────────

        function setup() {
            let canvas = createCanvas(800, 800);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            generateMohrGrid(params.gridRows, params.gridCols);
        }

        function draw() {
            // White background — Mohr plotter style (paper)
            background(255);

            drawMohrGrid();
        }

        // ─── UI HANDLERS ──────────────────────────

        function updateParam(paramName, value) {
            // Handle checkbox values
            if (typeof value === 'boolean') {
                params[paramName] = value;
                document.getElementById(paramName + '-value').textContent = value.toString();
                return;
            }

            let numVal = parseFloat(value);
            params[paramName] = numVal;
            document.getElementById(paramName + '-value').textContent = value;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                document.getElementById('seed-input').value = params.seed;
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            const sliders = ['gridRows', 'gridCols', 'noiseScale', 'noiseScale2', 'strokeWeight', 'falloffExponent', 'hardCutoffPct'];
            for (let s of sliders) {
                document.getElementById(s).value = params[s];
                document.getElementById(s + '-value').textContent = params[s];
            }
            document.getElementById('showGrid').checked = params.showGrid;
            document.getElementById('showGrid-value').textContent = params.showGrid;
            initializeSystem();
        }

        function downloadPNG() {
            clear(); // Transparent background instead of white
            saveCanvas('binary-resonance-seed-' + params.seed, 'png');
        }

        function downloadSVG() {
            let rows = params.gridRows;
            let cols = params.gridCols;
            let cellW = width / cols;
            let cellH = height / rows;
            let cx = cols / 2.0;
            let cy = rows / 2.0;
            let maxDist = sqrt(cx * cx + cy * cy);
            let cutoffDist = maxDist * params.hardCutoffPct;

            // Compute accent position (same as drawMohrGrid)
            let accentSize = 2;
            let marginCells = floor(min(rows, cols) * 0.15);
            randomSeed(params.seed + 42);
            let accentColS = floor(random(marginCells, cols - accentSize - marginCells));
            let accentRowS = floor(random(marginCells, rows - accentSize - marginCells));

            let svgLines = '';
            for (let i = 0; i < gridCells.length; i++) {
                let cell = gridCells[i];

                // Skip cells covered by red accent square
                if (cell.col >= accentColS && cell.col < accentColS + accentSize &&
                    cell.row >= accentRowS && cell.row < accentRowS + accentSize) continue;

                let dx = cell.col - cx;
                let dy = cell.row - cy;
                let dist = sqrt(dx * dx + dy * dy);

                if (dist > cutoffDist) continue;

                let density = max(0, 1.0 - pow(dist / cutoffDist, params.falloffExponent));
                if (random() > density) continue;

                let x = cell.col * cellW;
                let y = cell.row * cellH;

                if (cell.diagonal === 'forward') {
                    svgLines += `<line x1="${x}" y1="${y}" x2="${x + cellW}" y2="${y + cellH}" stroke="black" stroke-width="${params.strokeWeight}"/>\n`;
                } else {
                    svgLines += `<line x1="${x + cellW}" y1="${y}" x2="${x}" y2="${y + cellH}" stroke="black" stroke-width="${params.strokeWeight}"/>\n`;
                }
            }

            let cornerCut = min(cellW, cellH) * 1.0;
            let x0 = accentColS * cellW;
            let y0 = accentRowS * cellH;
            let w = accentSize * cellW;
            let h = accentSize * cellH;
            let pts = `${x0 + cornerCut},${y0} ${x0 + w - cornerCut},${y0} ${x0 + w},${y0 + cornerCut} ${x0 + w},${y0 + h - cornerCut} ${x0 + w - cornerCut},${y0 + h} ${x0 + cornerCut},${y0 + h} ${x0},${y0 + h - cornerCut} ${x0},${y0 + cornerCut}`;

            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            svg += `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">\n`;
            svg += `${svgLines}  <polygon points="${pts}" fill="red"/>\n`;
            svg += `</svg>`;

            let blob = new Blob([svg], { type: 'image/svg+xml' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `binary-resonance-seed-${params.seed}.svg`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.addEventListener('load', function() {
            // Seed display initialized in updateSeedDisplay if needed
        });
    </script>
</body>
</html>
